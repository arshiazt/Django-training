<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post List</title>
</head>

<body>
    {% for post in posts %}
    <p>{{post}}</p>
    <p>{{post.author}}</p>
    {% for cat in post.category.all %}
    <li><a>{{ cat.name }}</a> {% if not forloop.last %},{% endif %}
    </li>
    {% endfor %}
    {% endfor %}
</body>

</html>
